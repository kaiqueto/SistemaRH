<div class="flex min-h-screen flex-col bg-slate-100">
  <header class="bg-slate-900 shadow-md">
    <nav class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 px-4 py-3"
      aria-label="Menu principal">  
      <a routerLink="/lista-funcionarios" class="text-xl font-bold tracking-tight text-white">
            Sistema<span class="text-indigo-400">RH</span>
          </a>
        <ul class="mx-auto flex max-w-7xl flex-wrap items-center justify-center gap-1 px-4 py-3">
          @for (l of auth.estaLogado() ? linksPrivados : linksPublicos; track l.rota) {
            
              <li>
                <a [routerLink]="l.rota" routerLinkActive="bg-indigo-600 text-white"
                  class="block rounded-md px-3 py-2 text-sm font-medium text-slate-300 hover:text-white">
                  {{ l.texto }}
                </a>
              </li>
          }
          @if (auth.estaLogado()) {
            <li>
              <button type="button" (click)="auth.logout()"
                      class="rounded-md px-3 py-2 text-sm font-medium text-slate-300 hover:text-white">
                Sair
              </button>
            </li>
          }
        </ul>
    </nav>    
  </header>
  
  <main class="mx-auto w-full max-w-7xl px-4 py-6">
    <section class="rounded-lg bg-white p-6 shadow-sm">
      <router-outlet />
    </section>
  </main>
</div>
